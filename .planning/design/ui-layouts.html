<title>Pic 设置窗 · 四种控件布局</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px 20px 70px;background:#0a0d12;color:#e6ecf3;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.mast{max-width:960px;margin:0 auto 26px}
.mast h1{font-size:28px;font-weight:700;letter-spacing:-.022em;margin:0 0 10px}
.mast p{margin:0;color:#8f9aa8;max-width:64ch}
.mast code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:rgba(255,255,255,.07);
  padding:1px 5px;border-radius:4px;color:#9fd8f5}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.jump a{font-size:12px;color:#c2ccd8;text-decoration:none;padding:5px 12px;border-radius:999px;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.stack{max-width:820px;margin:0 auto;display:grid;gap:44px}
figure{margin:0;scroll-margin-top:20px}
.tag{display:flex;align-items:baseline;gap:11px;margin-bottom:12px}
.tag em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:#75808f;font-weight:500}
.tag s{text-decoration:none;font-size:12px;color:#8792a0}
figcaption{margin-top:14px;font-size:12.5px;color:#8f9aa8;max-width:66ch}
figcaption b{color:#e6ecf3;font-weight:600}

/* 共用蓝色皮肤 */
.w{position:relative;border-radius:13px;overflow:hidden;isolation:isolate;
  --sep:rgba(90,170,240,.16);--edge:rgba(90,190,255,.30);--acc:#4cc4f5;--accfg:#04202e;
  --glow:rgba(76,196,245,.30);
  background:#0c1e30;color:#dce8f4;border:1px solid rgba(90,190,255,.22);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 22px 56px rgba(0,0,0,.6),0 0 44px rgba(76,196,245,.10)}
.w::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(76,196,245,.13),transparent 40%),
             radial-gradient(46% 44% at 90% 94%,rgba(30,120,220,.28) 0,transparent 62%);
  animation:pulse 10s ease-in-out infinite alternate}
@keyframes pulse{0%{opacity:.5}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.w::before{animation:none}}
.w>*{position:relative;z-index:2}
.tb{display:flex;align-items:center;gap:8px;height:42px;padding:0 15px;
  background:rgba(90,190,255,.06);border-bottom:1px solid var(--sep)}
.lt{display:flex;gap:7px}.lt i{width:11px;height:11px;border-radius:50%;display:block}
.lt i:nth-child(1){background:#ff5f57}.lt i:nth-child(2){background:#febc2e}.lt i:nth-child(3){background:#28c840}
.tb .t{flex:1;text-align:center;font-size:13px;font-weight:600;padding-right:46px}
.bd{padding:16px}
.gh{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:rgba(120,200,255,.62);padding:0 4px 8px}
.card{background:rgba(15,38,60,.92);border:1px solid var(--sep);border-radius:10px;overflow:hidden;
  margin-bottom:15px}
.card:last-child{margin-bottom:0}
.n{font-family:"IBM Plex Mono",monospace;font-size:12px;white-space:nowrap}
.s{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.6;margin-top:2px}
.tile{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(160deg,#5ac8fa,#1668b8);
  box-shadow:0 0 0 1px var(--edge),0 0 14px var(--glow)}
.tile svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;border-radius:7px;padding:2px;gap:2px;background:rgba(90,190,255,.09);
  box-shadow:inset 0 0 0 1px var(--edge)}
.seg button{border:0;background:transparent;border-radius:5px;padding:4px 10px;font:inherit;
  font-family:"IBM Plex Mono",monospace;font-size:11px;cursor:pointer;color:rgba(220,232,244,.6)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);font-weight:600;
  box-shadow:0 0 14px var(--glow)}
.step{display:inline-flex;align-items:stretch}
.step button{width:23px;border:1px solid var(--sep);cursor:pointer;font-size:8px;line-height:1;
  font-family:inherit;background:transparent;color:var(--acc)}
.step .v{min-width:72px;text-align:center;padding:5px 0;font-size:11px;font-variant-numeric:tabular-nums;
  font-family:"IBM Plex Mono",monospace;border-block:1px solid var(--sep);color:var(--acc)}
.step button:first-child{border-radius:6px 0 0 6px}.step button:last-child{border-radius:0 6px 6px 0}
.rng{accent-color:var(--acc);width:100px;height:16px;flex:0 0 auto}
.val{font-family:"IBM Plex Mono",monospace;font-size:11px;min-width:42px;text-align:right;opacity:.75}
.tog{position:relative;width:40px;height:23px;border-radius:12px;border:0;cursor:pointer;flex:0 0 auto;
  background:rgba(120,180,240,.16)}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform .15s}
.tog[aria-checked="true"]{background:var(--acc);box-shadow:0 0 14px var(--glow)}
.tog[aria-checked="true"]::after{transform:translateX(17px)}
.btn{font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:5px 14px;border-radius:7px;cursor:pointer;
  background:transparent;border:1px solid var(--edge);color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accfg);border-color:transparent;font-weight:600;
  box-shadow:0 0 18px var(--glow)}
.off{opacity:.34}.off .rng,.off .step,.off .tog{pointer-events:none}
.rt{display:flex;align-items:center;gap:9px;min-width:0}

/* ═══ L1 · 标签槽右对齐（macOS 正统）═══════════════ */
.l1 .r{display:grid;grid-template-columns:96px auto 1fr;gap:6px 14px;align-items:center;
  padding:10px 15px;min-height:50px;border-bottom:1px solid var(--sep)}
.l1 .r:last-child{border-bottom:0}
.l1 .lab{text-align:right;font-size:12.5px;color:rgba(220,232,244,.92);white-space:nowrap}
.l1 .ic{grid-column:1;justify-self:start}
.l1 .ctl{justify-self:start}
.l1 .r.wide{grid-template-columns:96px 1fr}
.l1 .r.wide .ctl{justify-self:stretch;justify-content:space-between}

/* ═══ L2 · 控件右对齐成固定列 ═════════════════════ */
.l2 .r{display:grid;grid-template-columns:auto 1fr 158px;gap:12px;align-items:center;
  padding:10px 15px;min-height:50px;border-bottom:1px solid var(--sep)}
.l2 .r:last-child{border-bottom:0}
.l2 .lab{font-size:12.5px}
.l2 .ctl{justify-self:end;display:flex;align-items:center;gap:9px}
.l2 .ctl>*{flex:0 0 auto}

/* ═══ L3 · 标签在上、控件在下 ═════════════════════ */
.l3 .r{padding:11px 15px;border-bottom:1px solid var(--sep)}
.l3 .r:last-child{border-bottom:0}
.l3 .head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.l3 .lab{font-size:12.5px}
.l3 .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.l3 .r.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.l3 .r.split{grid-template-columns:1fr}}

/* ═══ L4 · 双列 + 控件紧跟标签 ════════════════════ */
.l4 .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:680px){.l4 .cols{grid-template-columns:1fr}}
.l4 .r{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;
  padding:10px 14px;min-height:48px;border-bottom:1px solid var(--sep)}
.l4 .r:last-child{border-bottom:0}
.l4 .lab{font-size:12.5px;white-space:nowrap}
.l4 .ctl{display:flex;align-items:center;gap:9px;justify-self:end}
</style>

<div class="mast">
  <h1>控件布局 · 四稿</h1>
  <p>之前的问题是 <code>justify-content: space-between</code> —— 标签贴左、控件贴右，中间空一大段，控件左边缘还参差不齐。四种改法，蓝色皮肤不变。</p>
  <div class="jump"><a href="#l1">标签槽</a><a href="#l2">等宽右列</a><a href="#l3">上下堆叠</a><a href="#l4">双列紧跟</a></div>
</div>

<div class="stack">
<script>
/* 行内容片段 */
var R_FOLDER=function(){return `<span class="tile"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></span>`};
var T_FOLDER='<svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>';
var T_MODE='<svg viewBox="0 0 24 24"><path d="M4 12h7M17 12h3"/><circle cx="14" cy="12" r="3"/></svg>';
var T_TIME='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>';
var T_SPD='<svg viewBox="0 0 24 24"><path d="M5 12h4l2-5 2 10 2-5h4"/></svg>';
var T_SND='<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
var T_BAT='<svg viewBox="0 0 24 24"><rect x="2" y="8" width="16" height="9" rx="2.5"/><path d="M21 11v3"/></svg>';
var T_PWR='<svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.5 7a8 8 0 1 0 11 0"/></svg>';
var T_SCAN='<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 5.5"/><path d="M20 5v6h-6"/></svg>';
var T_TR='<svg viewBox="0 0 24 24"><path d="M4 8h11l-3-3M20 16H9l3 3"/></svg>';
var SEG='<span class="seg" data-seg><button data-m="s">单循环</button><button data-m="l" aria-pressed="true">列表循环</button><button data-m="r">随机</button></span>';
var STEP='<span class="step"><button data-d="-1">▼</button><span class="v">15 分钟</span><button data-d="1">▲</button></span>';
var SPD='<span class="rt"><input class="rng" type="range" min=".5" max="2" step=".05" value="1"><span class="val">1.00×</span></span>';
var SND='<span class="rt"><input class="rng" data-vol type="range" min="0" max="100" value="60"><span class="val">60%</span><button class="tog" role="switch" aria-checked="true"></button></span>';
var TOGOFF='<button class="tog" role="switch" aria-checked="false"></button>';

var BODIES={
 l1:`<div class="bd">
   <div class="gh">壁纸来源</div>
   <div class="card"><div class="r wide">
     <span class="lab">文件夹</span>
     <span class="ctl"><span class="rt"><span class="n">~/Movies/Wallpapers</span><span class="s">递归扫子目录 · MP4 / MOV / M4V</span></span><button class="btn">选择…</button></span>
   </div></div>
   <div class="gh">播放</div>
   <div class="card" data-play>
     <div class="r"><span class="lab">模式</span><span class="ctl">${SEG}</span></div>
     <div class="r" data-rot><span class="lab">轮换</span><span class="ctl">${STEP}</span></div>
     <div class="r"><span class="lab">速度</span><span class="ctl">${SPD}</span></div>
     <div class="r"><span class="lab">声音</span><span class="ctl">${SND}</span></div>
   </div>
   <div class="gh">电源与系统</div>
   <div class="card">
     <div class="r"><span class="lab">电池时播放</span><span class="ctl">${TOGOFF}</span></div>
     <div class="r"><span class="lab">开机自启</span><span class="ctl">${TOGOFF}</span></div>
   </div></div>`,

 l2:`<div class="bd">
   <div class="gh">壁纸来源</div>
   <div class="card"><div class="r">
     <span class="rt" style="gap:11px"><span class="tile">${T_FOLDER}</span><span class="lab">文件夹</span></span>
     <span class="ctl"></span>
     <span class="ctl"><button class="btn">选择…</button></span>
   </div>
   <div class="r"><span class="rt" style="gap:11px"><span class="lab" style="opacity:.6">递归扫子目录 · MP4 / MOV / M4V</span></span><span class="ctl"></span><span class="ctl"></span></div>
   </div>
   <div class="gh">播放</div>
   <div class="card" data-play>
     <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_MODE}</span><span class="lab">模式</span></span><span class="ctl"></span><span class="ctl">${SEG}</span></div>
     <div class="r" data-rot><span class="rt" style="gap:11px"><span class="tile">${T_TIME}</span><span class="lab">轮换</span></span><span class="ctl"></span><span class="ctl">${STEP}</span></div>
     <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_SPD}</span><span class="lab">速度</span></span><span class="ctl"></span><span class="ctl">${SPD}</span></div>
     <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_SND}</span><span class="lab">声音</span></span><span class="ctl"></span><span class="ctl">${SND}</span></div>
   </div>
   <div class="gh">电源与系统</div>
   <div class="card">
     <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_BAT}</span><span class="lab">电池时播放</span></span><span class="ctl"></span><span class="ctl">${TOGOFF}</span></div>
     <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_PWR}</span><span class="lab">开机自启</span></span><span class="ctl"></span><span class="ctl">${TOGOFF}</span></div>
   </div></div>`,

 l3:`<div class="bd">
   <div class="gh">壁纸来源</div>
   <div class="card"><div class="r">
     <div class="head"><span class="tile">${T_FOLDER}</span><span class="lab">文件夹</span></div>
     <div class="ctl"><span class="n" style="opacity:.7">~/Movies/Wallpapers</span><button class="btn">选择…</button></div>
     <div class="s" style="margin-top:8px">递归扫子目录 · MP4 / MOV / M4V</div>
   </div></div>
   <div class="gh">播放</div>
   <div class="card" data-play>
     <div class="r split">
       <div><div class="head"><span class="tile">${T_MODE}</span><span class="lab">播放模式</span></div><div class="ctl">${SEG}</div></div>
       <div data-rot><div class="head"><span class="tile">${T_TIME}</span><span class="lab">轮换时间</span></div><div class="ctl">${STEP}</div></div>
     </div>
     <div class="r split">
       <div><div class="head"><span class="tile">${T_SPD}</span><span class="lab">播放速度</span></div><div class="ctl">${SPD}</div></div>
       <div><div class="head"><span class="tile">${T_SND}</span><span class="lab">声音</span></div><div class="ctl">${SND}</div></div>
     </div>
   </div>
   <div class="gh">电源与系统</div>
   <div class="card">
     <div class="r split">
       <div><div class="head"><span class="tile">${T_BAT}</span><span class="lab">电池供电时播放</span></div><div class="ctl">${TOGOFF}</div></div>
       <div><div class="head"><span class="tile">${T_PWR}</span><span class="lab">开机自动启动</span></div><div class="ctl">${TOGOFF}</div></div>
     </div>
   </div></div>`,

 l4:`<div class="bd"><div class="cols">
   <div>
     <div class="gh">壁纸来源</div>
     <div class="card"><div class="r">
       <span class="rt" style="gap:11px"><span class="tile">${T_FOLDER}</span><span><span class="lab">文件夹</span><span class="s" style="display:block">~/Movies/Wallpapers</span></span></span>
       <span class="ctl"><button class="btn">选择…</button></span>
     </div></div>
     <div class="gh">播放</div>
     <div class="card" data-play>
       <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_MODE}</span><span class="lab">模式</span></span><span class="ctl">${SEG}</span></div>
       <div class="r" data-rot><span class="rt" style="gap:11px"><span class="tile">${T_TIME}</span><span class="lab">轮换</span></span><span class="ctl">${STEP}</span></div>
       <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_SPD}</span><span class="lab">速度</span></span><span class="ctl">${SPD}</span></div>
       <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_SND}</span><span class="lab">声音</span></span><span class="ctl">${SND}</span></div>
     </div>
   </div>
   <div>
     <div class="gh">电源与系统</div>
     <div class="card">
       <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_BAT}</span><span class="lab">电池时播放</span></span><span class="ctl">${TOGOFF}</span></div>
       <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_PWR}</span><span class="lab">开机自启</span></span><span class="ctl">${TOGOFF}</span></div>
     </div>
     <div class="gh">维护</div>
     <div class="card">
       <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_SCAN}</span><span class="lab">重新扫描</span></span><span class="ctl"><button class="btn">扫描</button></span></div>
       <div class="r"><span class="rt" style="gap:11px"><span class="tile">${T_TR}</span><span class="lab">转码</span></span><span class="ctl"><button class="btn pri">打开…</button></span></div>
     </div>
   </div>
 </div></div>`
};

var SKINS=[
 ["l1","标签槽右对齐","macOS 正统。所有标签右对齐到同一条基线，控件从同一条线开始 —— 上下形成干净的槽。就是系统设置本人的排法。"],
 ["l2","控件右对齐成列","标签贴左，控件全部右对齐，右列定宽 158px。左右各一条直线，中间是弹性空白。适合宽窗。"],
 ["l3","标签在上控件在下","没有水平间隙这回事。每项自成一格，标签 + 图标一行，控件下一行。窗可以做得更矮更宽。"],
 ["l4","双列 + 控件紧跟","左列管播放、右列管系统。控件紧贴标签右端不拉满，行更短、视线移动更少。"],
];
var host=document.currentScript.parentNode;
SKINS.forEach(function(s){
  var f=document.createElement("figure"); f.id=s[0];
  f.innerHTML='<div class="tag"><em>'+s[0].toUpperCase()+'</em><s>'+s[1]+'</s></div>'+
    '<div class="w '+s[0]+'"><div class="tb"><span class="lt"><i></i><i></i><i></i></span><span class="t">Pic 设置</span></div>'+
    BODIES[s[0]]+'</div><figcaption><b>'+s[1]+'。</b>'+s[2]+'</figcaption>';
  host.appendChild(f);
});
document.addEventListener("click",function(e){
  var b=e.target.closest("button[data-m]");
  if(b){var seg=b.parentElement;
    Array.prototype.forEach.call(seg.children,function(x){x.setAttribute("aria-pressed",String(x===b))});
    var card=seg.closest(".card"),rot=card&&card.querySelector("[data-rot]");
    if(rot)rot.classList.toggle("off",b.dataset.m==="s");return;}
  var t=e.target.closest(".tog");
  if(t){t.setAttribute("aria-checked",String(t.getAttribute("aria-checked")!=="true"));
    var c=t.closest(".card"),v=c&&c.querySelector("[data-vol]");
    if(v)v.classList.toggle("off",t.getAttribute("aria-checked")!=="true");return;}
  var s=e.target.closest("button[data-d]");
  if(s){var st=s.parentElement,v=st.querySelector(".v");if(st.closest(".off"))return;
    var V=[5,10,15,30,60,120],i=parseInt(v.dataset.i||"2",10);
    i=Math.max(0,Math.min(5,i+parseInt(s.dataset.d,10)));v.dataset.i=i;
    v.textContent=V[i]>=60?(V[i]/60)+" 小时":V[i]+" 分钟";}
});
document.addEventListener("input",function(e){
  if(!e.target.classList.contains("rng"))return;
  var o=e.target.parentElement.querySelector(".val");if(!o)return;
  o.textContent=e.target.max==="2"?Number(e.target.value).toFixed(2)+"×":e.target.value+"%";
});
</script>
</div>
