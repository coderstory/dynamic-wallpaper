<title>Pic 图标 · C3 对齐修正</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px 20px 70px;background:#0a0d12;color:#e6ecf3;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mast{max-width:940px;margin:0 auto 26px}
.mast h1{font-size:28px;font-weight:700;letter-spacing:-.022em;margin:0 0 10px}
.mast p{margin:0;color:#8f9aa8;max-width:66ch}
h2{font-size:15px;font-weight:600;margin:42px 0 6px}
.sub{font-size:12px;color:#7c8794;margin:0 0 18px;max-width:68ch}
.wrap{max-width:940px;margin:0 auto}
.row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:11px;color:#7c8794;font-family:ui-monospace,Menlo,monospace;text-align:center;line-height:1.55}
svg.ic{border-radius:22.5%;display:block;filter:drop-shadow(0 5px 12px rgba(0,0,0,.42))}
.ondesk{background:linear-gradient(135deg,#2b3f57,#16222f);padding:34px 28px;border-radius:14px;
  display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap;border:1px solid rgba(255,255,255,.08)}
.onlight{background:linear-gradient(135deg,#f2f0ec,#e4e0d9);padding:34px 28px;border-radius:14px;
  display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap}
.guide{position:relative;display:inline-block}
.guide .cx,.guide .cy{position:absolute;background:#ff3b8d;pointer-events:none;opacity:.85;z-index:5}
.guide .cx{left:50%;top:-8px;bottom:-8px;width:1px;transform:translateX(-.5px)}
.guide .cy{top:50%;left:-8px;right:-8px;height:1px;transform:translateY(-.5px)}
.before{opacity:.95}
.panel{display:grid;grid-template-columns:auto auto;gap:26px;align-items:end;justify-items:center}
@media (max-width:620px){.panel{grid-template-columns:auto}}
.mbar{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 16px;height:26px;border-radius:7px}
.mbar.light{background:linear-gradient(#f6f6f6,#ececec);color:#111}
.mbar.dark{background:linear-gradient(#2c2c2e,#1c1c1e);color:#eee}
.mbar .mi{opacity:.8;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.tbl th,.tbl td{text-align:left;padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.tbl th{color:#7c8794;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tbl td{font-family:ui-monospace,Menlo,monospace}
.ok{color:#4cd07d}.bad{color:#ff6b6b}
</style>

<div class="mast">
  <h1>C3 · 几何对齐修正</h1>
  <p>粉色十字是画布正中心（512, 512）。左边是修正前，右边是修正后 —— 对着十字看就能验。</p>
</div>

<div class="wrap">

<h2>修正前 / 修正后</h2>
<div class="panel" style="margin-top:14px">
  <div class="cell"><div class="guide" id="gBefore"></div><div class="cap">修正前<br><span style="opacity:.7">整体重心偏右下</span></div></div>
  <div class="cell"><div class="guide" id="gAfter"></div><div class="cap">修正后<br><span style="opacity:.7">全部对齐到 512</span></div></div>
</div>

<table class="tbl">
  <thead><tr><th>元素</th><th>修正前中心</th><th>修正后中心</th></tr></thead>
  <tbody>
    <tr><td>后窗 水平</td><td class="bad">487</td><td class="ok">512</td></tr>
    <tr><td>前窗 水平</td><td class="ok">512</td><td class="ok">512</td></tr>
    <tr><td>播放三角 水平</td><td class="bad">533</td><td class="ok">512</td></tr>
    <tr><td>基线 水平</td><td class="ok">512</td><td class="ok">512</td></tr>
    <tr><td>整体重心 垂直</td><td class="bad">530</td><td class="ok">510</td></tr>
  </tbody>
</table>

<h2>三档圆角 · 128px（带辅助线）</h2>
<p class="sub">对着中轴线看三角是否居中。</p>
<div class="row" id="big"></div>

<h2>实际尺寸 · 72px / 32px</h2>
<div class="ondesk" id="mid"></div>
<div class="onlight" id="small" style="margin-top:14px"></div>

<h2>菜单栏图标</h2>
<div class="grid2">
  <div><div class="mbar light" id="mlight"></div></div>
  <div><div class="mbar dark" id="mdark"></div></div>
</div>

</div>

<script>
/* ── 修正后的几何（全部按 512 轴对齐）───────────────
   前窗  x=212 w=600  → 212..812  中心 512
   后窗  x=252 w=520  → 252..772  中心 512  (左右各内缩 40)
   三角  x=448 w=128  → 448..576  中心 512
                       y 居中于前窗(368..698, 中心 533) → 469..597
   基线  x=300 w=424  → 300..724  中心 512
   整体  y 250..770   → 中心 510  ≈ 512
   ─────────────────────────────────────────────── */
function geo(sw, glow){
  return `
<rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
${glow?'<rect width="1024" height="1024" rx="228" fill="url(#gl)"/>':''}
<rect x="252" y="250" width="520" height="280" rx="52" fill="none" stroke="#F08A2E" stroke-width="30" opacity=".42"/>
<rect x="212" y="368" width="600" height="330" rx="58" fill="url(#or)"/>
<path d="M448 469 L576 533 L448 597 Z" fill="#FFFFFF" stroke="#FFFFFF"
      stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 770 H724" stroke="#E8641A" stroke-width="34" stroke-linecap="round" opacity=".3"/>`;
}
var DEFS = `
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#FFF9F2"/><stop offset="1" stop-color="#F7E9D8"/>
  </linearGradient>
  <linearGradient id="or" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#FFAE4D"/><stop offset="1" stop-color="#E8641A"/>
  </linearGradient>
  <radialGradient id="gl" cx="0.5" cy="0.52" r="0.5">
    <stop offset="0" stop-color="#FFA43D" stop-opacity=".42"/><stop offset="1" stop-color="#FFA43D" stop-opacity="0"/>
  </radialGradient>
</defs>`;

function svgAfter(sw, size){
  return `<svg viewBox="0 0 1024 1024" class="ic" style="width:${size}px;height:${size}px">${DEFS}${geo(sw,true)}</svg>`;
}
function svgBefore(size){
  // 旧几何：后窗 x=252 w=470（中心 487）、三角 470..596（中心 533）、整体下移 18
  return `<svg viewBox="0 0 1024 1024" class="ic" style="width:${size}px;height:${size}px">${DEFS}
<rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
<rect width="1024" height="1024" rx="228" fill="url(#gl)"/>
<rect x="252" y="268" width="470" height="284" rx="52" fill="none" stroke="#F08A2E" stroke-width="30" opacity=".42"/>
<rect x="212" y="388" width="600" height="330" rx="58" fill="url(#or)"/>
<path d="M470 495 L596 553 L470 611 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="50" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 792 H724" stroke="#E8641A" stroke-width="34" stroke-linecap="round" opacity=".3"/></svg>`;
}

document.getElementById("gBefore").innerHTML = svgBefore(190) + '<span class="cx"></span><span class="cy"></span>';
document.getElementById("gAfter").innerHTML  = svgAfter(50,190) + '<span class="cx"></span><span class="cy"></span>';

var ROUND = {r1:{sw:26,n:"R1 微圆"}, r2:{sw:50,n:"R2 中圆"}, r3:{sw:78,n:"R3 很圆"}};
function cell(k,size,guide){
  var d=document.createElement("div"); d.className="cell";
  var inner = svgAfter(ROUND[k].sw, size);
  if(guide) inner = '<div class="guide">'+inner+'<span class="cx"></span></div>';
  d.innerHTML = inner + '<div class="cap">'+ROUND[k].n+'</div>';
  return d;
}
["r1","r2","r3"].forEach(function(k){ document.getElementById("big").appendChild(cell(k,150,true)); });
["r1","r2","r3"].forEach(function(k){ document.getElementById("mid").appendChild(cell(k,72,false)); });
["r1","r2","r3"].forEach(function(k){ document.getElementById("small").appendChild(cell(k,32,false)); });

/* 菜单栏：视觉重心补偿 —— 三角在圆角容器里要略微右移才显得居中 */
function menuIcon(sw, nudge){
  var x0 = 10.9 + nudge, x1 = 14.3 + nudge, yc = 13.6, h = 1.8;
  return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="3.2" width="11" height="7" rx="2" opacity=".5"/>
    <rect x="4.5" y="8.4" width="15" height="9.8" rx="2.4"/>
    <path d="M${x0} ${yc-h} L${x1} ${yc} L${x0} ${yc+h} Z" fill="currentColor"
          stroke="currentColor" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
document.getElementById("mlight").innerHTML = '<span class="mi">◐</span>'+menuIcon(.6,0)+menuIcon(1.4,.15)+menuIcon(2.2,.3);
document.getElementById("mdark").innerHTML  = '<span class="mi">◐</span>'+menuIcon(.6,0)+menuIcon(1.4,.15)+menuIcon(2.2,.3);
</script>
