<title>Pic 设置窗 · 丰富版</title>
<style>
/* ── 三稿的共同点 ───────────────────────────────────────
   1. 每行一个彩色图标瓷砖（系统设置本人的做法，不是我发明的）
   2. 窗口里有极淡的流动光晕 —— 暗示壁纸在动，但不显示任何视频内容
   3. 控件有内高光和层次，不是平贴的灰块
   ─────────────────────────────────────────────────────── */
:root{
  color-scheme:light;
  --ground:#e6e7ea; --ink:#15171b; --ink2:#5a606a; --ink3:#8b919b;
  --line:rgba(12,14,19,.11); --card:#fff; --card2:#f4f5f7;
  --accent:#1f62f5;
  --tint-a:#18c0d8; --tint-b:#e0457e;
  --tile-sh:0 1px 2px rgba(0,0,0,.16);
  --win-sh:0 1px 2px rgba(0,0,0,.10),0 20px 48px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0c0e11; --ink:#f2f4f7; --ink2:#9aa1ab; --ink3:#6f7681;
    --line:rgba(255,255,255,.12); --card:#1b1e23; --card2:#23272d;
    --accent:#4d8bff; --tint-a:#12a8bd; --tint-b:#c93a6d;
    --tile-sh:0 1px 3px rgba(0,0,0,.5);
    --win-sh:0 1px 2px rgba(0,0,0,.5),0 22px 54px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0c0e11; --ink:#f2f4f7; --ink2:#9aa1ab; --ink3:#6f7681;
  --line:rgba(255,255,255,.12); --card:#1b1e23; --card2:#23272d;
  --accent:#4d8bff; --tint-a:#12a8bd; --tint-b:#c93a6d;
  --tile-sh:0 1px 3px rgba(0,0,0,.5);
  --win-sh:0 1px 2px rgba(0,0,0,.5),0 22px 54px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;padding:32px 20px 68px;background:var(--ground);color:var(--ink);
     font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
     -webkit-font-smoothing:antialiased}
h1{font-family:"Bricolage Grotesque",-apple-system,sans-serif}

.mast{max-width:920px;margin:0 auto 32px}
.mast h1{font-size:28px;font-weight:700;letter-spacing:-.022em;margin:0 0 9px;text-wrap:balance}
.mast p{margin:0;color:var(--ink2);max-width:64ch}
.mast .rule{display:flex;flex-wrap:wrap;gap:13px;margin-top:15px;font-size:11.5px;color:var(--ink3)}
.mast .rule span{display:flex;align-items:center;gap:6px}
.mast .rule span::before{content:"";width:6px;height:6px;border-radius:2px;
  background:linear-gradient(135deg,var(--tint-a),var(--tint-b))}

.stack{max-width:940px;margin:0 auto;display:grid;gap:40px}
figure{margin:0}
.tag{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.tag em{font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
        color:var(--ink3);font-weight:700}
.tag s{text-decoration:none;font-size:11.5px;color:var(--ink3)}
figcaption{margin-top:13px;font-size:12px;color:var(--ink2);max-width:64ch}
figcaption b{color:var(--ink);font-weight:600}

/* ── 窗口 ─────────────────────────────────────────────── */
.win{position:relative;border-radius:12px;overflow:hidden;box-shadow:var(--win-sh);
     border:1px solid var(--line);isolation:isolate}
/* 流动光晕：壁纸在动的暗示，不显示内容 */
.win::before{
  content:"";position:absolute;inset:-40%;z-index:0;pointer-events:none;
  background:
    radial-gradient(42% 55% at 18% 22%, color-mix(in srgb,var(--tint-a) 55%,transparent) 0%, transparent 62%),
    radial-gradient(46% 60% at 82% 76%, color-mix(in srgb,var(--tint-b) 48%,transparent) 0%, transparent 60%);
  filter:blur(52px);opacity:.30;
  animation:sway 22s ease-in-out infinite alternate;
}
.win::after{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.60),rgba(255,255,255,.88));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .win::after{
    background:linear-gradient(180deg,rgba(16,18,22,.52),rgba(14,16,20,.80));}
}
:root[data-theme="dark"] .win::after{background:linear-gradient(180deg,rgba(16,18,22,.52),rgba(14,16,20,.80))}
@keyframes sway{0%{transform:translate3d(-4%,-3%,0) scale(1.02)}100%{transform:translate3d(4%,3%,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.win::before{animation:none}}
.win>*{position:relative;z-index:1}

.tbar{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;
      background:rgba(255,255,255,.42);border-bottom:1px solid var(--line);
      backdrop-filter:blur(20px) saturate(160%)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tbar{background:rgba(255,255,255,.05)}}
:root[data-theme="dark"] .tbar{background:rgba(255,255,255,.05)}
.lights{display:flex;gap:7px}.lights i{width:11px;height:11px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tbar .t{flex:1;text-align:center;font-size:13px;font-weight:600;padding-right:46px}
.body{padding:15px}

/* ── 行 + 图标瓷砖 ────────────────────────────────────── */
.grp{margin-bottom:14px}.grp:last-child{margin-bottom:0}
.gh{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink3);padding:0 4px 7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
      box-shadow:0 1px 1.5px rgba(0,0,0,.05)}
.r{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;
   padding:9px 14px 9px 11px;min-height:46px;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r>.c{display:flex;align-items:center;gap:9px;justify-content:flex-end;min-width:0;flex-wrap:wrap}
.tile{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
      box-shadow:var(--tile-sh);flex:0 0 auto}
.tile svg{width:15px;height:15px;display:block;fill:none;stroke:#fff;stroke-width:1.9;
          stroke-linecap:round;stroke-linejoin:round}
.t1{background:linear-gradient(160deg,#4aa8ff,#1f62f5)}
.t2{background:linear-gradient(160deg,#8e7bff,#5b3df0)}
.t3{background:linear-gradient(160deg,#ffb648,#f07d1a)}
.t4{background:linear-gradient(160deg,#3ddc97,#12a06a)}
.t5{background:linear-gradient(160deg,#ff7a9c,#e0457e)}
.t6{background:linear-gradient(160deg,#7d8794,#4e5661)}
.lbl{min-width:0}
.lbl .n{font-size:12.5px;white-space:nowrap}
.sub{font-size:11px;color:var(--ink3);margin-top:1px;line-height:1.4}
.note{font-size:11px;color:var(--ink3);padding:8px 14px 10px;border-top:1px solid var(--line);line-height:1.55}
.path{font-size:11.5px;color:var(--ink2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.read{font-size:11.5px;color:var(--ink2);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.off{opacity:.38}.off .rng,.off .step,.off .tog{pointer-events:none}

/* ── 控件（带内高光和层次）───────────────────────────── */
button,input{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 32%,transparent);border-radius:6px}
.seg{display:inline-flex;background:rgba(120,126,138,.16);border-radius:7px;padding:2px;gap:2px;
     box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
.seg button{border:0;background:transparent;border-radius:5px;padding:4px 11px;font-size:12px;
            color:var(--ink2);cursor:pointer;transition:color .12s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;
            box-shadow:0 1px 2px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.05)}
.step{display:inline-flex;align-items:stretch}
.step button{width:23px;border:1px solid var(--line);background:var(--card);cursor:pointer;
             font-size:8px;color:var(--ink2);line-height:1}
.step .v{min-width:72px;text-align:center;padding:5px 0;font-size:11.5px;
         background:linear-gradient(180deg,var(--card2),var(--card));
         border:1px solid var(--line);border-left:0;border-right:0;font-variant-numeric:tabular-nums}
.step button:first-child{border-radius:6px 0 0 6px}.step button:last-child{border-radius:0 6px 6px 0}
.rng{accent-color:var(--accent);width:106px;height:16px;flex:0 1 106px;min-width:60px}
.tog{position:relative;width:39px;height:22px;border-radius:11px;border:0;cursor:pointer;
     background:rgba(120,126,138,.34);flex:0 0 auto;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
            background:linear-gradient(180deg,#fff,#f0f0f2);
            box-shadow:0 1px 2px rgba(0,0,0,.32);transition:transform .15s}
.tog[aria-checked="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));
            box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.tog[aria-checked="true"]::after{transform:translateX(17px)}
.btn{font-size:12px;padding:4px 14px;border-radius:7px;cursor:pointer;
     background:linear-gradient(180deg,var(--card),var(--card2));
     border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.09)}
.btn:active{background:var(--card2)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,#fff),var(--accent));
         color:#fff;border-color:transparent;font-weight:600;
         box-shadow:0 1px 3px color-mix(in srgb,var(--accent) 45%,transparent)}

/* 布局 */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:740px){.cols2{grid-template-columns:1fr}}
.inline{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:11px 14px;align-items:center;
        padding:9px 14px 9px 11px;border-bottom:1px solid var(--line);min-height:46px}
.inline:last-child{border-bottom:0}
@media (max-width:740px){.inline{grid-template-columns:auto 1fr}}
.rowbtns{display:flex;gap:9px;justify-content:flex-end;padding-top:12px}
.tabs{display:flex;gap:2px;padding:0 12px;background:rgba(255,255,255,.42);
      border-bottom:1px solid var(--line);backdrop-filter:blur(20px) saturate(160%)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tabs{background:rgba(255,255,255,.05)}}
:root[data-theme="dark"] .tabs{background:rgba(255,255,255,.05)}
.tabs button{border:0;background:transparent;padding:8px 13px 9px;font-size:12.5px;color:var(--ink2);
             cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.pane{display:none}.pane.on{display:block}

/* 大字号版 */
.big .r{min-height:54px;padding:12px 16px 12px 12px}
.big .lbl .n{font-size:13.5px}
.big .tile{width:30px;height:30px;border-radius:8px}
.big .tile svg{width:17px;height:17px}
.big .gh{font-size:11.5px;padding-bottom:9px}
</style>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  function hookSeg(segId,rotId){
    var seg=$('#'+segId),rot=rotId?$('#'+rotId):null;
    seg.addEventListener('click',function(e){
      var b=e.target.closest('button[data-m]');if(!b)return;
      $$('button',seg).forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
      if(rot)rot.classList.toggle('off',b.dataset.m==='s');
    });
  }
  hookSeg('a-seg','a-rot');hookSeg('b-seg','b-rot');hookSeg('c-seg','c-rot');
  function hookTog(cardId,volId){
    var card=$('#'+cardId),vol=volId?$('#'+volId):null;
    var t=card.querySelector('.tog');if(!t)return;
    t.addEventListener('click',function(){
      var on=t.getAttribute('aria-checked')!=='true';
      t.setAttribute('aria-checked',String(on));
      if(vol)vol.classList.toggle('off',!on);
    });
  }
  hookTog('a-play','a-vol');hookTog('b-play');hookTog('c-play','c-vol');
  $$('.tog').forEach(function(t){
    if(t.closest('#a-play')||t.closest('#b-play')||t.closest('#c-play'))return;
    t.addEventListener('click',function(){
      t.setAttribute('aria-checked',String(t.getAttribute('aria-checked')!=='true'));
    });
  });
  var VALS=[5,10,15,30,60,120],i=2;
  var vs=$$('.step');
  function paint(){$$('.step .v').forEach(function(v){
    v.textContent=VALS[i]>=60?(VALS[i]/60)+' 小时':VALS[i]+' 分钟';});}
  vs.forEach(function(s){
    $$('button',s).forEach(function(b){
      b.addEventListener('click',function(){
        var rot=s.closest('.off')?s.closest('.off'):null;
        var row=s.closest('[id$="-rot"]');
        if(row&&row.classList.contains('off'))return;
        i=Math.max(0,Math.min(VALS.length-1,i+parseInt(b.dataset.d,10)));paint();
      });
    });
  });
  $$('.rng').forEach(function(r){
    var out=r.parentElement.querySelector('.read');if(!out)return;
    r.addEventListener('input',function(){
      out.textContent=r.max==='2'?Number(r.value).toFixed(2)+'×':r.value+'%';});
  });
  var tabs=$('#c-tabs');
  tabs.addEventListener('click',function(e){
    var b=e.target.closest('button[data-p]');if(!b)return;
    $$('button',tabs).forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
    $$('.pane').forEach(function(p){p.classList.toggle('on',p.dataset.pane===b.dataset.p)});
  });
})();
</script>
