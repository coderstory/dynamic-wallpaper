<title>Pic 图标 · C3 圆角</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:30px 20px 70px;background:#0a0d12;color:#e6ecf3;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mast{max-width:940px;margin:0 auto 28px}
.mast h1{font-size:28px;font-weight:700;letter-spacing:-.022em;margin:0 0 10px}
.mast p{margin:0;color:#8f9aa8;max-width:66ch}
h2{font-size:15px;font-weight:600;margin:42px 0 6px}
.sub{font-size:12px;color:#7c8794;margin:0 0 18px;max-width:68ch}
.wrap{max-width:940px;margin:0 auto}
.row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:11px;color:#7c8794;font-family:ui-monospace,Menlo,monospace;text-align:center}
svg.ic{border-radius:22.5%;display:block;filter:drop-shadow(0 5px 12px rgba(0,0,0,.42))}
.ondesk{background:linear-gradient(135deg,#2b3f57,#16222f);padding:34px 28px;border-radius:14px;
  display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap;border:1px solid rgba(255,255,255,.08)}
.onlight{background:linear-gradient(135deg,#f2f0ec,#e4e0d9);padding:34px 28px;border-radius:14px;
  display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap}
.mbar{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 16px;height:26px;border-radius:7px}
.mbar.light{background:linear-gradient(#f6f6f6,#ececec);color:#111}
.mbar.dark{background:linear-gradient(#2c2c2e,#1c1c1e);color:#eee}
.mbar .mi{opacity:.8;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:11.5px;color:#8f9aa8;margin-top:12px}
.legend b{color:#e6ecf3;font-weight:600}
</style>

<div class="mast">
  <h1>C3 · 三角圆角三档</h1>
  <p>颜色和光晕都是你选的 C3 不变，只调中间那个播放三角的圆润程度。圆角用加粗圆角描边实现 —— 比手写圆弧均匀，缩到小尺寸也不会变形。</p>
</div>

<div class="wrap">

<h2>三档对比 · 128px</h2>
<p class="sub">放大看清楚差别。</p>
<div class="row" id="big"></div>

<h2>关键尺寸 · 72px 与 32px</h2>
<p class="sub">72 是 Dock 尺寸，32 是访达列表和 ⌘Tab 里的大小。圆角在小尺寸下会「吃掉」三角的尖，所以要在这里定。</p>
<div class="ondesk" id="mid"></div>
<div class="onlight" id="small" style="margin-top:14px"></div>

<h2>菜单栏图标（同款圆角）</h2>
<p class="sub">模板图跟着一起圆，否则两套图标会脱节。</p>
<div class="grid2">
  <div><div class="mbar light" id="mlight"></div></div>
  <div><div class="mbar dark" id="mdark"></div></div>
</div>

</div>

<script>
/* C3 底子不变，只换三角描边宽度 = 圆角半径的两倍 */
function c3(sw){
  return `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#FFF9F2"/><stop offset="1" stop-color="#F7E9D8"/>
  </linearGradient>
  <linearGradient id="or" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#FFAE4D"/><stop offset="1" stop-color="#E8641A"/>
  </linearGradient>
  <radialGradient id="gl" cx="0.5" cy="0.55" r="0.5">
    <stop offset="0" stop-color="#FFA43D" stop-opacity=".42"/><stop offset="1" stop-color="#FFA43D" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
<rect width="1024" height="1024" rx="228" fill="url(#gl)"/>
<rect x="252" y="268" width="470" height="284" rx="52" fill="none" stroke="#F08A2E" stroke-width="30" opacity=".42"/>
<rect x="212" y="388" width="600" height="330" rx="58" fill="url(#or)"/>
<path d="M470 495 L596 553 L470 611 Z" fill="#FFFFFF" stroke="#FFFFFF"
      stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M300 792 H724" stroke="#E8641A" stroke-width="34" stroke-linecap="round" opacity=".3"/>
</svg>`;
}

var ROUND = {
  r1:{sw:26, name:"R1 微圆",  desc:"接近直角三角，最克制"},
  r2:{sw:50, name:"R2 中圆",  desc:"明显圆润，仍看得出是三角"},
  r3:{sw:78, name:"R3 很圆",  desc:"接近水滴形，最柔和"}
};

function svgOf(k, size){
  return c3(ROUND[k].sw).replace('viewBox="0 0 1024 1024"',
    'viewBox="0 0 1024 1024" class="ic" style="width:'+size+'px;height:'+size+'px"');
}
function cell(k, size, showName){
  var d=document.createElement("div"); d.className="cell";
  d.innerHTML = svgOf(k,size) +
    (showName ? '<div class="cap">'+ROUND[k].name+'<br><span style="opacity:.7">'+ROUND[k].desc+'</span></div>'
              : '<div class="cap">'+k.toUpperCase()+'</div>');
  return d;
}
["r1","r2","r3"].forEach(function(k){ document.getElementById("big").appendChild(cell(k,128,true)); });
["r1","r2","r3"].forEach(function(k){ document.getElementById("mid").appendChild(cell(k,72)); });
["r1","r2","r3"].forEach(function(k){ document.getElementById("small").appendChild(cell(k,32)); });

/* 菜单栏：同款圆角三角 */
function menuIcon(sw){
  return `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="7" y="3.2" width="11" height="7" rx="2" opacity=".5"/>
    <rect x="4.5" y="8.4" width="15" height="9.8" rx="2.4"/>
    <path d="M11 12 L14.2 13.6 L11 15.2 Z" fill="currentColor"
          stroke="currentColor" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}
var mi1 = menuIcon(0.6), mi2 = menuIcon(1.4), mi3 = menuIcon(2.2);
document.getElementById("mlight").innerHTML = '<span class="mi">◐</span>'+mi1+mi2+mi3;
document.getElementById("mdark").innerHTML  = '<span class="mi">◐</span>'+mi1+mi2+mi3;
</script>
